<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TalkAnchor Dashboard (Demo)</title>
  <meta name="description" content="TalkAnchor Dashboard-Demo mit Beispieldaten — kein echtes Gerät verbunden." />
  <link rel="stylesheet" href="style.css" />
  <style>
    .demo-banner {
      background: #ffc857;
      color: #3a2a00;
      text-align: center;
      padding: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .demo-banner a { color: #3a2a00; }
  </style>
</head>
<body>
  <div class="demo-banner">
    Dies ist eine Demo mit Beispieldaten — kein echtes Gerät verbunden. Siehe
    <a href="dokumentation.html">Dokumentation</a> oder das
    <a href="https://github.com/martin141089/UniFi-Talk">GitHub-Repo</a> für die echte Installation.
  </div>
  <header class="topbar">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true">
        <g fill="none" stroke="#00D9A3" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="50" cy="20" r="9"/>
          <line x1="50" y1="29" x2="50" y2="80"/>
          <path d="M50,80 C50,93 34,95 24,84"/>
          <path d="M50,80 C50,93 66,95 76,84"/>
          <g stroke-width="9.5">
            <line x1="26" y1="45" x2="26" y2="55"/>
            <line x1="36" y1="38" x2="36" y2="62"/>
            <line x1="50" y1="32" x2="50" y2="68"/>
            <line x1="64" y1="38" x2="64" y2="62"/>
            <line x1="74" y1="45" x2="74" y2="55"/>
          </g>
        </g>
      </svg>
      <span>TalkAnchor</span>
    </div>
    <div class="badges">
      <span id="dry-run-badge" class="badge">LIVE</span>
      <span class="badge subtle">v0.1.0 · Demo</span>
    </div>
  </header>

  <main>
    <section class="cards">
      <div class="card">
        <h2>Aktuelle IP</h2>
        <p class="big" id="current-ip">–</p>
        <p class="muted" id="last-change">–</p>
      </div>
      <div class="card">
        <h2>Health-Status</h2>
        <p class="big" id="health-status">–</p>
        <p class="muted" id="health-message">–</p>
      </div>
      <div class="card actions">
        <h2>Aktionen</h2>
        <button id="check-now-btn">Jetzt prüfen</button>
        <button id="rollback-btn" class="danger">Rollback auf letztes Backup</button>
        <p class="muted" id="action-result"></p>
      </div>
    </section>

    <section class="panel">
      <h2>Verlauf</h2>
      <table id="history-table">
        <thead>
          <tr>
            <th>Zeit</th><th>Alt → Neu</th><th>Dry-Run</th><th>Apply</th><th>Health</th><th>Rollback</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>Live-Log</h2>
      <pre id="live-log"></pre>
    </section>
  </main>

  <script src="demo.js"></script>
</body>
</html>
