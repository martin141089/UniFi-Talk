<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="TalkAnchor icon">
  <title>TalkAnchor</title>
  <rect width="100" height="100" rx="20" fill="#0F2A3F"/>
  <g fill="none" stroke="#00D9A3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- ring -->
    <circle cx="50" cy="20" r="9"/>
    <!-- shank -->
    <line x1="50" y1="29" x2="50" y2="80"/>
    <!-- flukes -->
    <path d="M50,80 C50,93 34,95 24,84"/>
    <path d="M50,80 C50,93 66,95 76,84"/>
    <!-- soundwave crossbar, replacing the traditional anchor bar -->
    <g stroke-width="6.5">
      <line x1="26" y1="45" x2="26" y2="55"/>
      <line x1="36" y1="38" x2="36" y2="62"/>
      <line x1="50" y1="32" x2="50" y2="68"/>
      <line x1="64" y1="38" x2="64" y2="62"/>
      <line x1="74" y1="45" x2="74" y2="55"/>
    </g>
  </g>
</svg>
