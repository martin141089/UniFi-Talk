services:
  talkanchor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/martin141089/unifi-talk:latest
    container_name: talkanchor
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - talkanchor-data:/app/data
      # SSH-Key + known_hosts read-only mounten, passend zu
      # TALKANCHOR_UNIFI_TALK__SSH_KEY_PATH (Standard: ~/.ssh/id_ed25519,
      # was im Container zu /home/talkanchor/.ssh/id_ed25519 wird).
      - ~/.ssh:/home/talkanchor/.ssh:ro
      # Alternative zu .env: stattdessen eine vom Wizard erzeugte config.yaml mounten.
      # - ../config.yaml:/app/config.yaml:ro
    ports:
      - "8420:8420"

volumes:
  talkanchor-data:
